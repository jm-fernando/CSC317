<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Calculator</title>
    <link rel="stylesheet" href="styles/calculator.css">
</head>

<body>

    <nav class = "navbar">
        <a href="../index.html" class="nav-link">← Back to Portfolio</a>
        <h1 class="nav-title">CALCULATOR</h1>
    </nav>

    <main class = "calculator-container">
        <section class = "calculator">
           <div class = "calc-screen" id = "calc-screen">0</div>

           <div class = "buttons">
                <button class = "calc-util" id = "backspace">DEL</button>
                <button class = "calc-util" id = "clear">C</button>
                <button class = "calc-util" id = "percent">%</button>
                <button class = "calc-operator" id = "divide">/</button>

                <button class = "calc-number" id = "7">7</button>
                <button class = "calc-number" id = "8">8</button>
                <button class = "calc-number" id = "9">9</button>
                <button class = "calc-operator" id = "multiply">*</button>

                <button class = "calc-number" id = "4">4</button>
                <button class = "calc-number" id = "5">5</button>
                <button class = "calc-number" id = "6">6</button>
                <button class = "calc-operator" id = "subtract">-</button>

                <button class = "calc-number" id = "1">1</button>
                <button class = "calc-number" id = "2">2</button>
                <button class = "calc-number" id = "3">3</button>
                <button class = "calc-operator" id = "add">+</button>

                <button class = "calc-operator" id = "plus-minus">+/-</button>
                <button class = "calc-number" id = "0">0</button>
                <button class = "calc-number" id = "decimal">.</button>
                <button class = "calc-equal" id = "equals">=</button>
           </div>
        </section>
    </main>
    <script src="scripts/calculator.js"></script>
</body>
</html>
